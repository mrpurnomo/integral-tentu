<style>/* Area & Calculus — tema cerah (biru laut, tosca, pasir). Semua komponen kustom (tanpa tampilan bawaan peramban). Landscape saja. */
:root {
  color-scheme: light;
  --awan: #F7F4EC; --putih: #fff; --tinta: #12254A; --tinta-2: #2B3F58; --tinta-3: #55657A; --garis: #E2DCCB; --garis-2: #CFC7B1;
  --markisa: #13294B; --markisa-tua: #0A1A33; --markisa-muda: #E9EEF7; --markisa-100: #CCD7EA;
  --mentari: #E0AE4A; --mentari-100: #FBF1D8; --mentari-800: #6E4C0B;
  --mint: #2FA36B; --mint-100: #DDF3E6; --mint-800: #14663F;
  --koral: #B3232D; --koral-100: #FBE1DF; --koral-800: #7E1820;
  --jingga: #B8832B; --jingga-100: #F8EBCF; --jingga-800: #6E4C0B;
  /* tujuh bagian materi (pos) + dua aksen cadangan */
  --f-bawah: #C23A3F; --f-bawah-t: #FBE1DF; --f-bawah-d: #7E1820;
  --f-potong: #C9922F; --f-potong-t: #FBF1D8; --f-potong-d: #6E4C0B;
  --f-garis: #2A5AA7; --f-garis-t: #E3EBF8; --f-garis-d: #0A1A33;
  --f-parab: #5B7FB8; --f-parab-t: #E5ECF7; --f-parab-d: #26406E;
  --f-silang: #8C5A1E; --f-silang-t: #F4EADB; --f-silang-d: #5A3A0F;
  --f-sumbuy: #8A2B4A; --f-sumbuy-t: #F6E3EA; --f-sumbuy-d: #5E1B33;
  --f-kanan: #3C4F6B; --f-kanan-t: #E4E9F0; --f-kanan-d: #1F2C40;
  --f-tangga: #A8742A; --f-tangga-t: #F4E8CC; --f-tangga-d: #6E4C0B;
  --f-sepotong: #12254A; --f-sepotong-t: #E3E8EE; --f-sepotong-d: #12254A;
  --r: .9rem; --r-lg: 1.3rem; --bayang: 0 .1rem .2rem rgba(18,38,63,.07), 0 .6rem 1.4rem -.6rem rgba(18,38,63,.22);
  --tampil: "Fraunces", "Segoe UI", system-ui, sans-serif; --isi: "Jakarta", "Segoe UI", system-ui, sans-serif; --mat: "Fraunces Math", "Cambria Math", Cambria, Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.2,.8,.2,1); --pegas: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: max(11px, min(calc(100vw / 74), calc(100vh / 51))); height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; }
body { margin: 0; height: 100%; overflow: hidden; font-family: var(--isi); font-size: 1.05rem; line-height: 1.45; color: var(--tinta); background: var(--awan); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
h1, h2, h3, h4 { font-family: var(--tampil); margin: 0 0 .3em; line-height: 1.1; letter-spacing: -.01em; }
h1 { font-size: 2.6rem; } h2 { font-size: 1.9rem; } h3 { font-size: 1.25rem; } p { margin: 0 0 .6em; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.kode, input { user-select: text; -webkit-user-select: text; }
.muted { color: var(--tinta-3); } .kecil { font-size: .85rem; } .tengah { text-align: center; } .tebal { font-weight: 700; }
.mat { font-family: var(--mat); font-style: italic; }

/* ---------- scrollbar kustom ---------- */
.gulir { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--markisa) transparent; -webkit-overflow-scrolling: touch; }
.gulir::-webkit-scrollbar { width: .55rem; height: .55rem; }
.gulir::-webkit-scrollbar-track { background: transparent; }
.gulir::-webkit-scrollbar-thumb { background: var(--markisa-100); border-radius: 1rem; border: .12rem solid transparent; background-clip: padding-box; }
.gulir::-webkit-scrollbar-thumb:hover, .gulir::-webkit-scrollbar-thumb:active { background: var(--markisa); background-clip: padding-box; }

/* ---------- kerangka aplikasi ---------- */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; background:
  radial-gradient(40rem 22rem at 4% -6rem, #F2D690 0, rgba(255,231,163,0) 70%), radial-gradient(40rem 22rem at 98% -5rem, #CCD7EA 0, rgba(228,217,252,0) 70%), var(--awan); }
.bar-atas { flex: none; display: flex; align-items: center; gap: 1rem; padding: .55rem 2.2rem; height: 3.4rem; }
.logo { font-family: var(--tampil); font-weight: 700; font-size: 1.45rem; letter-spacing: -.02em; display: inline-flex; gap: .4rem; align-items: center; }
.logo b { background: var(--mentari); padding: 0 .35em .05em; border-radius: .5rem; transform: rotate(-3deg); display: inline-block; box-shadow: 0 .14rem 0 rgba(122,86,0,.28); }
.bar-atas .ruang { flex: 1; }
.bar-bawah { flex: none; display: flex; align-items: center; gap: .8rem; padding: .6rem 1.4rem .8rem; min-height: 4.2rem; }
.panggung { flex: 1; min-height: 0; position: relative; margin: .4rem 2.2rem 1rem; padding: 0; display: flex; flex-direction: column; }
.layar { position: absolute; inset: 0; display: flex; flex-direction: column; animation: masuk .45s var(--ease) both; }
@keyframes masuk { from { opacity: 0; transform: translateY(.8rem) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes keluar { to { opacity: 0; transform: translateY(-.6rem); } }

/* ---------- komponen ---------- */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 3rem; padding: 0 1.4rem; border: .14rem solid var(--markisa); border-radius: var(--r); background: var(--markisa); color: #fff; font-weight: 700; font-size: 1.05rem; cursor: pointer; box-shadow: 0 .2rem 0 var(--markisa-tua); transition: transform .08s, box-shadow .08s, background .15s, opacity .2s; touch-action: manipulation; white-space: nowrap; }
.btn:active { transform: translateY(.2rem); box-shadow: 0 0 0 var(--markisa-tua); }
.btn.sekunder { background: #fff; color: var(--markisa-tua); border-color: var(--garis-2); box-shadow: 0 .2rem 0 var(--garis-2); }
.btn.hijau { background: var(--mint); border-color: var(--mint); color: #0B3A24; box-shadow: 0 .2rem 0 #1F7F52; }
.btn.sorot { background: var(--mentari); border-color: var(--mentari); color: var(--tinta); box-shadow: 0 .2rem 0 #9A6F1E; }
.btn.bahaya { background: var(--koral); border-color: var(--koral); box-shadow: 0 .2rem 0 #8E1B22; }
.btn.besar { min-height: 3.6rem; font-size: 1.25rem; padding: 0 2.2rem; border-radius: 1.1rem; }
.btn.kecil { min-height: 2.4rem; padding: 0 .9rem; font-size: .9rem; border-radius: .7rem; }
.btn[disabled], .btn.mati { opacity: .45; pointer-events: none; box-shadow: none; }
.btn.denyut { animation: denyut 1.6s infinite; }
@keyframes denyut { 0%,100% { box-shadow: 0 .2rem 0 var(--markisa-tua), 0 0 0 0 rgba(19,41,75,.5); } 60% { box-shadow: 0 .2rem 0 var(--markisa-tua), 0 0 0 .9rem rgba(19,41,75,0); } }
.kartu { background: #fff; border: 1px solid var(--garis); border-radius: var(--r-lg); box-shadow: var(--bayang); padding: 1.1rem 1.3rem; }
.chip { display: inline-flex; align-items: center; gap: .4rem; padding: .15rem .8rem; border-radius: 99px; font-weight: 700; font-size: .85rem; background: var(--markisa-muda); color: var(--markisa-tua); white-space: nowrap; }
.chip.ok { background: var(--mint-100); color: var(--mint-800); } .chip.warn { background: var(--jingga-100); color: var(--jingga-800); } .chip.bad { background: var(--koral-100); color: var(--koral-800); } .chip.abu { background: #ECE7D6; color: var(--tinta-2); } .chip.sorot { background: var(--mentari-100); color: var(--mentari-800); }
.ik { width: 1.3rem; height: 1.3rem; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ik.besar { width: 2rem; height: 2rem; } .ik.kecil { width: 1rem; height: 1rem; }
.eyebrow { display: inline-flex; align-items: center; gap: .5rem; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-3); margin-bottom: .3rem; }
.eyebrow::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: var(--t, var(--markisa)); }

.fx-garis { --t: var(--f-garis); --tt: var(--f-garis-t); --td: var(--f-garis-d); } .fx-parab { --t: var(--f-parab); --tt: var(--f-parab-t); --td: var(--f-parab-d); }
.fx-silang { --t: var(--f-silang); --tt: var(--f-silang-t); --td: var(--f-silang-d); } .fx-sumbuy { --t: var(--f-sumbuy); --tt: var(--f-sumbuy-t); --td: var(--f-sumbuy-d); }
.fx-kanan { --t: var(--f-kanan); --tt: var(--f-kanan-t); --td: var(--f-kanan-d); } .fx-tangga { --t: var(--f-tangga); --tt: var(--f-tangga-t); --td: var(--f-tangga-d); }

/* ---------- dialog / popup ---------- */

/* ---------- papan ketik kustom ---------- */
.papan-ketik { display: grid; gap: .5rem; margin-top: .6rem; }

/* ---------- putar tablet (hanya landscape) ---------- */
#putar { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; background: linear-gradient(160deg, #13294B, #12254A 55%, #5B7FB8); color: #fff; text-align: center; padding: 2rem; }

.tablet::before { content: ""; position: absolute; left: 50%; bottom: 2.4vw; width: 5vw; height: 1vw; margin-left: -2.5vw; background: #fff; border-radius: 1vw; }

.rumus-blok { font-size: 1.25em; line-height: 1.9; }

/* ---------- alur grafik + penjelasan bertahap ---------- */

.huruf-l { display: inline-block; min-width: 1.5em; text-align: center; background: var(--markisa); color: #fff; border-radius: .45em; padding: 0 .25em; font-family: var(--mat); font-style: italic; font-weight: 700; margin: 0 .08em; }
.slot-f.kosong { font-style: italic; color: var(--tinta-3); } .slot-f.denyut { animation: denyutl 1s ease-in-out infinite; }
.fd-cap { min-height: 6.2rem; background: var(--mentari-100); border-radius: 1.1rem; padding: .7rem 1rem; font-size: 1.12rem; line-height: 1.4; } .fd-n { display: block; font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--mentari-800); margin-bottom: .15rem; }
.fd-titik { display: flex; gap: .4rem; justify-content: center; } .fd-titik .dt { width: .8rem; height: .8rem; border-radius: 50%; background: var(--garis-2); } .fd-titik .dt.isi { background: var(--mint); } .fd-titik .dt.now { background: var(--markisa); transform: scale(1.35); }
.fd-tabel tr.sorot td { background: #FFE9A8; font-weight: 700; } .fd-tabel .fd-sel { color: var(--mint-800); font-weight: 700; } .fd-tabel .dl { display: inline-block; }
.fd-plot { overflow: hidden; border-radius: .8rem; } .fd-plot svg { will-change: transform; } .fd-kiri { overflow: hidden; } .fung-rumus.benar { color: var(--mint-800); } .fung-rumus.benar .slot-f { border-color: var(--mint); background: var(--mint-100); color: var(--mint-800); }
.fd-terbang { position: fixed; z-index: 450; pointer-events: none; background: var(--mint); color: #0B3A24; font-family: var(--tampil); font-weight: 700; font-size: 1.7rem; border-radius: .9rem; padding: .05rem .8rem; box-shadow: 0 .6rem 1.4rem rgba(18,184,134,.5); }
.plot-besar { height: 20rem; }

.peran-wrap { margin: auto; width: min(54rem, 100%); display: flex; flex-direction: column; gap: 1rem; } .peran-dua { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
.peran-kartu { display: flex; flex-direction: column; align-items: center; text-align: center; gap: .5rem; background: #fff; border: .16rem solid var(--garis-2); border-radius: 1.6rem; padding: 1.4rem 1.4rem 1.2rem; cursor: pointer; box-shadow: 0 .25rem 0 var(--garis-2), var(--bayang); font-size: 1.1rem; color: var(--tinta); } .peran-kartu:active { transform: translateY(.2rem); box-shadow: none; }
.peran-kartu .ubin { width: 4.4rem; height: 4.4rem; padding: .9rem; border-radius: 1.3rem; } .peran-kartu h2 { margin: .2rem 0 0; font-size: 1.7rem; } .peran-kartu p { margin: 0; color: var(--tinta-2); line-height: 1.4; min-height: 6rem; }
.pam-atas { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; background: #fff; border: 1px solid var(--garis); border-radius: var(--r-lg); padding: .5rem .9rem; margin-bottom: .5rem; } .pam-bar { flex: 1; min-width: 12rem; display: flex; flex-direction: column; gap: .2rem; }
.pj-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; align-content: start; }
.pj { background: #fff; border: .14rem solid var(--garis-2); border-radius: 1.1rem; padding: .6rem .7rem; } .pj.ok { background: var(--mint-100); border-color: var(--mint); } .pj.sorot { box-shadow: 0 0 0 .22rem rgba(255,194,51,.7); border-color: var(--mentari); } .pj .ubin { width: 2.4rem; height: 2.4rem; padding: .45rem; border-radius: .7rem; flex: none; } .pj .btn.kecil { min-height: 2.4rem; font-size: .88rem; padding: 0 .7rem; } .pj .aktifx { background: var(--mint); border-color: var(--mint); color: #0B3A24; }
.ajar-bar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; background: var(--mentari-100); border-radius: 1rem; padding: .45rem .8rem; margin-bottom: .5rem; }
/* ---------- tujuh bagian: tebak/cocok/pameran/sintesis ---------- */
.fam-pilih { grid-template-columns: repeat(4, 1fr); }
.persamaan { display: flex; flex-direction: column; gap: .15rem; font-size: 1.22rem; margin: .1rem 0 .5rem; }
.tabel-mini td, .tabel-mini th { white-space: nowrap; text-align: center; }
.pj .muted.kecil { font-size: .8rem; }
.pj.sorot { box-shadow: 0 0 0 .25rem var(--mentari), var(--bayang); }
.fung-rumus .ig, .fung-umum .ig { font-size: 1em; } .fung-rumus .slot-f { vertical-align: middle; }
/* hub: jangan melebar melewati layar */
.t2-hub { grid-template-columns: 19rem minmax(0, 1fr); } .t2-utama { min-width: 0; }
.t2-langkah.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .t2-langkah.n6 .t2-kartu { min-width: 0; padding: .9rem 1rem; }
.t2-langkah.n6 .t2-tbl { padding: 0 .6rem; font-size: .95rem; min-height: 2.6rem; } .t2-langkah.n6 .t2-kartu .chip { font-size: .72rem; padding: .15rem .5rem; }
.t2-judul { min-width: 0; flex-wrap: wrap; gap: .4rem 1rem; }
.fung-umum .mat, .fung-rumus { display: block; line-height: 2.1; }
.fung-rumus .ig-l { height: auto; gap: .35rem; font-size: 1rem; margin-left: -.1em; } .fung-rumus .ig { align-items: center; }
.fung-rumus { margin-bottom: 1.2rem; }

/* Area & Calculus — identitas visual "Tinta & Kuningan": navy tua, emas kuningan, merah tinta koreksi, putih gading.
   Gaya gambar teknik: garis ukur kuningan, sudut bingkai (crop mark), arsiran diagonal. Dimuat PALING AKHIR (menimpa tema dasar). */
:root {
  --navy-950: #081428; --navy-900: #0C1E3E; --navy-800: #12294F; --navy-700: #1B3A6B; --navy-100: #E9EEF7;
  --emas: #C9922F; --emas-t: #E0AE4A; --emas-m: #F0CC7E; --emas-p: #FBF1D8; --emas-d: #7A5A1A;
  --merah: #B3232D; --merah-t: #C23A3F; --gading: #F7F4EC; --awan: #F4F1E8;
  --bayang: inset 0 1px 0 rgba(255,255,255,.95), 0 .1rem .2rem rgba(12,30,62,.06), 0 1rem 1.8rem -1rem rgba(12,30,62,.34);
  --garis: #E3DDCB; --garis-2: #D2C9AE;
}
body { background: var(--awan); color: var(--navy-900); }
#app { background:
  linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0) 20rem),
  repeating-linear-gradient(0deg, rgba(18,41,79,.05) 0 1px, transparent 1px 1.6rem),
  repeating-linear-gradient(90deg, rgba(18,41,79,.05) 0 1px, transparent 1px 1.6rem), var(--awan); }
h1, h2 { font-weight: 640; letter-spacing: -.012em; }

/* ---------- bilah atas: kuningan di atas navy ---------- */
.bar-atas { position: relative; height: 3.7rem; padding: .5rem 2.2rem; background: linear-gradient(180deg, var(--navy-800), var(--navy-950)); color: var(--gading); box-shadow: 0 .6rem 1.4rem -.8rem rgba(8,20,40,.7); z-index: 5; }
.bar-atas::after { content: ""; position: absolute; left: 0; right: 0; bottom: -.28rem; height: .28rem; background: linear-gradient(90deg, var(--emas), var(--emas-m) 35%, var(--emas-t) 60%, var(--emas)); }
.bar-atas::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: .34rem; opacity: .55; background: repeating-linear-gradient(90deg, rgba(240,204,126,.9) 0 1px, transparent 1px .62rem); -webkit-mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.logo { color: var(--gading); font-size: 1.4rem; gap: .35rem; letter-spacing: -.01em; }
.logo::before { content: "∫"; display: inline-grid; place-items: center; width: 2rem; height: 2rem; margin-right: .5rem; border: .1rem solid var(--emas-t); border-radius: 50%; color: var(--emas-m); font-family: var(--mat); font-style: italic; font-weight: 300; font-size: 1.3rem; line-height: 1; padding-bottom: .1rem; box-shadow: inset 0 0 .6rem rgba(224,174,74,.3); }
.logo b { background: none; padding: 0; transform: none; box-shadow: none; color: var(--emas-t); font-style: italic; font-weight: 600; }
.bar-atas .chip { background: rgba(247,244,236,.09); color: var(--gading); border: 1px solid rgba(240,204,126,.32); }
.bar-atas .chip.ok { background: rgba(224,174,74,.16); color: var(--emas-m); border-color: rgba(240,204,126,.5); }
.bar-atas .chip.warn { background: rgba(179,35,45,.28); color: #FFD3D3; border-color: rgba(255,150,150,.4); }
.bar-atas .chip.sorot { background: var(--emas-t); color: var(--navy-950); border-color: var(--emas-m); }
.bar-atas .chip.abu { background: rgba(247,244,236,.07); color: #C9D3E6; }
.bar-atas .btn.sekunder, .bar-atas .btn.kecil { background: transparent; color: var(--gading); border-color: rgba(240,204,126,.45); box-shadow: none; }
.bar-atas .btn.sekunder:hover { background: rgba(240,204,126,.14); }
.bar-atas .btn.sekunder:active { transform: translateY(.1rem); }

/* ---------- tombol ---------- */
.btn { background: linear-gradient(180deg, var(--navy-700), var(--navy-900)); border-color: var(--navy-950); color: var(--gading); box-shadow: 0 .2rem 0 var(--navy-950), inset 0 1px 0 rgba(240,204,126,.4); }
.btn:active { box-shadow: 0 0 0 var(--navy-950), inset 0 1px 0 rgba(240,204,126,.2); }
.btn.sekunder { background: #fff; color: var(--navy-800); border-color: var(--garis-2); box-shadow: 0 .2rem 0 var(--garis-2); }
.btn.sorot, .btn.hijau { background: linear-gradient(180deg, var(--emas-m), var(--emas-t) 55%, var(--emas)); border-color: #A9761B; color: #2A1B02; box-shadow: 0 .2rem 0 #8A5E12, inset 0 1px 0 rgba(255,255,255,.6); }
.btn.sorot:active, .btn.hijau:active { box-shadow: 0 0 0 #8A5E12; }
.btn.bahaya { background: linear-gradient(180deg, var(--merah-t), var(--merah)); border-color: #7E1820; box-shadow: 0 .2rem 0 #6F1219, inset 0 1px 0 rgba(255,255,255,.25); }
.btn.denyut { animation: denyut-navy 1.7s infinite; }
.btn.sorot.denyut, .btn.hijau.denyut { animation: denyut-emas 1.7s infinite; }
@keyframes denyut-navy { 0%,100% { box-shadow: 0 .2rem 0 var(--navy-950), 0 0 0 0 rgba(27,58,107,.55); } 60% { box-shadow: 0 .2rem 0 var(--navy-950), 0 0 0 1rem rgba(27,58,107,0); } }
@keyframes denyut-emas { 0%,100% { box-shadow: 0 .2rem 0 #8A5E12, 0 0 0 0 rgba(224,174,74,.7); } 60% { box-shadow: 0 .2rem 0 #8A5E12, 0 0 0 1rem rgba(224,174,74,0); } }

/* ---------- kartu bergaya lembar gambar: sudut emas ---------- */
.kartu { position: relative; background: linear-gradient(180deg, #fff, #FFFEFB); border: 1px solid var(--garis); }
.kartu::before, .kartu::after { content: ""; position: absolute; width: .85rem; height: .85rem; pointer-events: none; opacity: .85; }
.kartu::before { top: .45rem; left: .45rem; border-top: .13rem solid var(--emas); border-left: .13rem solid var(--emas); border-top-left-radius: .25rem; }
.kartu::after { bottom: .45rem; right: .45rem; border-bottom: .13rem solid var(--emas); border-right: .13rem solid var(--emas); border-bottom-right-radius: .25rem; }
.eyebrow { color: var(--emas-d); letter-spacing: .14em; }
.eyebrow::before { width: .5rem; height: .5rem; border-radius: .08rem; transform: rotate(45deg); background: var(--t, var(--emas)); }
.chip { background: var(--navy-100); color: var(--navy-800); }
.chip.sorot { background: var(--emas-p); color: var(--emas-d); }
.chip.ok { background: var(--navy-100); color: var(--navy-800); }
.chip.bad { background: #FBE1DF; color: #7E1820; }

/* ---------- dialog ---------- */
.tirai { background: rgba(8,20,40,.62); }
.dialog { border-top: .32rem solid var(--emas-t); background: #FFFEFB; }
.dialog .tutup-x { background: var(--navy-100); }
.toast { background: var(--navy-900); border: 1px solid rgba(240,204,126,.45); color: var(--gading); }

/* ---------- tombol angka, opsi, timer ---------- */
.opsi { border-color: var(--garis); }
.opsi.pilih { border-color: var(--navy-800); background: var(--navy-100); box-shadow: 0 0 0 .22rem rgba(224,174,74,.5); }
.opsi.pilih .huruf { background: var(--navy-800); color: var(--emas-m); }
.opsi .huruf { background: var(--emas-p); color: var(--emas-d); }
.opsi.benar { background: #EAF5EE; border-color: #2E8B5E; } .opsi.salah { background: #FBE9E8; border-color: var(--merah); }
.timer { background: var(--navy-900); color: var(--emas-m); }

/* ---------- pengantar (slide) ---------- */
.intro .kepala-intro { border-left: .32rem solid var(--emas-t); background: linear-gradient(90deg, #fff, #FFFEFB); }
.intro .kepala-intro h2 { color: var(--navy-900); }
.intro .titik-langkah i.sudah { background: var(--emas-m); } .intro .titik-langkah i.aktif { background: linear-gradient(90deg, var(--emas), var(--emas-t)); }
.intro .kendali { border-bottom: .22rem solid var(--emas-t); }
.hero h1 .hl, .judul-besar .hl { background: linear-gradient(transparent 62%, rgba(224,174,74,.55) 62%); }

/* ---------- sambutan: panggung navy dengan ilustrasi dua kurva ---------- */
.welcome { inset: 0; border-radius: 1.8rem; overflow: hidden; display: block; text-align: left; color: var(--gading);
  background: radial-gradient(60rem 38rem at 78% 40%, rgba(27,58,107,.9), transparent 70%), linear-gradient(135deg, var(--navy-950), var(--navy-900) 55%, #0F2650);
  box-shadow: 0 1.4rem 3rem -1.2rem rgba(8,20,40,.7), inset 0 0 0 .1rem rgba(240,204,126,.28); }
.welcome::before { content: ""; position: absolute; inset: .7rem; border: 1px solid rgba(240,204,126,.28); border-radius: 1.3rem; pointer-events: none; }
.welcome::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(240,204,126,.045) 0 1px, transparent 1px 2rem), repeating-linear-gradient(90deg, rgba(240,204,126,.045) 0 1px, transparent 1px 2rem); }
.hero-premium { position: relative; z-index: 2; height: 100%; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; gap: 1rem; padding: 2.2rem 3.4rem 2.2rem 4.4rem; }
.hp-sekolah { display: inline-flex; align-items: center; gap: .7rem; font-size: .95rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--emas-m); }
.hp-sekolah i { width: 2.6rem; height: .14rem; background: linear-gradient(90deg, var(--emas-t), transparent); display: inline-block; }
.hp-judul { font-size: 7.4rem; line-height: .95; margin: 1.1rem 0 1.2rem; font-weight: 560; color: var(--gading); letter-spacing: -.035em; animation: judul-masuk 1s var(--ease) both; }
.hp-judul .hp-dan { display: inline-block; margin: 0 .12em; font-style: italic; font-weight: 300; color: var(--emas-t); font-family: var(--mat); transform: translateY(-.03em); }
@keyframes judul-masuk { from { opacity: 0; transform: translateY(1.4rem); letter-spacing: .02em; } }
.hp-sub { font-size: 1.4rem; line-height: 1.5; color: #D4DCEB; max-width: 34rem; margin: 0 0 1.8rem; animation: judul-masuk 1s .2s var(--ease) both; }
.hp-aksi { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; animation: judul-masuk 1s .4s var(--ease) both; }
.hp-aksi .btn.sekunder { background: transparent; color: var(--gading); border-color: rgba(240,204,126,.55); box-shadow: none; }
.hp-aksi .btn.sekunder:hover { background: rgba(240,204,126,.14); }
.hp-aksi .btn:not(.sorot):not(.sekunder) { background: linear-gradient(180deg, #2A4F8C, var(--navy-700)); border-color: rgba(240,204,126,.45); }
.hp-catatan { margin-top: 1.4rem; font-size: .95rem; color: #9FB0CC; display: flex; align-items: center; gap: .6rem; } .hp-catatan::before { content: ""; width: .5rem; height: .5rem; border-radius: .08rem; background: var(--merah-t); transform: rotate(45deg); }
.hp-kanan { height: 100%; min-height: 0; display: grid; place-items: center; } .hero-svg { width: 100%; max-height: 100%; filter: drop-shadow(0 1.2rem 1.6rem rgba(0,0,0,.35)); }
.hs-panel { fill: rgba(247,244,236,.035); stroke: rgba(240,204,126,.5); stroke-width: 1.4; }
.hs-kisi { stroke: rgba(240,204,126,.1); stroke-width: 1; fill: none; } .hs-kisi.mayor { stroke: rgba(240,204,126,.2); }
.hs-sumbu { stroke: #F7F4EC; stroke-opacity: .8; stroke-width: 2.4; fill: none; stroke-linecap: round; }
.hs-kurva { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: tarik 1.7s .5s cubic-bezier(.4,.1,.2,1) forwards; } .hs-f { stroke: #F7F4EC; } .hs-g { stroke: #F0646C; animation-delay: .9s; }
@keyframes tarik { to { stroke-dashoffset: 0; } }
.hs-sapu { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: sapu 1.8s 2.1s cubic-bezier(.3,.1,.2,1) forwards; } @keyframes sapu { to { transform: scaleX(1); } }
.hs-titik circle { fill: var(--emas-t); stroke: var(--navy-950); stroke-width: 3; opacity: 0; animation: tampil-titik .5s 1.9s var(--pegas) forwards; } .hs-titik .hs-ring { fill: none; stroke: var(--emas-m); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: cincin 2.4s 2.2s infinite; } .hs-titik .hs-ring.r2 { animation-delay: 3s; }
@keyframes tampil-titik { to { opacity: 1; } } @keyframes cincin { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
.hs-t { font-family: "Fraunces Math", Georgia, serif; font-style: italic; font-size: 22px; fill: #F7F4EC; opacity: 0; animation: tampil-titik .8s 2.2s forwards; } .hs-t.g { fill: #FF9CA2; } .hs-t.ab { fill: var(--emas-m); font-size: 26px; }
.hs-rm { font-family: "Fraunces Math", Georgia, serif; font-size: 26px; fill: var(--gading); opacity: 0; animation: tampil-titik 1s 3.3s forwards; } .hs-rm .bt { font-size: 15px; fill: var(--emas-t); font-style: italic; } .hs-rm .it { font-style: italic; }
@media (prefers-reduced-motion: reduce) { .hs-kurva { animation-duration: .01s; } .hs-sapu { animation-duration: .01s; } }

/* ---------- pilih kelas: kartu bergaya papan nama ---------- */
.kartu-kelas { border-color: var(--navy-800); background: linear-gradient(180deg, #fff, #FBF8EE); box-shadow: 0 .25rem 0 var(--navy-800), 0 1rem 1.6rem -1rem rgba(12,30,62,.4); }
.kartu-kelas.belum { border-color: var(--garis-2); box-shadow: 0 .25rem 0 var(--garis-2); opacity: .75; }
.kartu-kelas .kelas-nama { color: var(--navy-900); }
.ubin { box-shadow: 0 .2rem 0 rgba(8,20,40,.25), inset 0 1px 0 rgba(255,255,255,.35); }

/* ---------- pengantar kelas dua kurva ---------- */
.judul-slide, .bersiap { position: absolute; inset: 0; border-radius: 1.6rem; overflow: hidden; color: var(--gading); display: grid; align-items: center;
  background: radial-gradient(50rem 30rem at 82% 45%, rgba(27,58,107,.9), transparent 70%), linear-gradient(135deg, var(--navy-950), var(--navy-900) 55%, #0F2650); box-shadow: 0 1.2rem 2.6rem -1.2rem rgba(8,20,40,.7), inset 0 0 0 .1rem rgba(240,204,126,.28); }
.judul-slide::before, .bersiap::before { content: ""; position: absolute; inset: .6rem; border: 1px solid rgba(240,204,126,.26); border-radius: 1.1rem; pointer-events: none; }
.judul-slide { grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); padding: 2rem 2.4rem 2rem 3.6rem; gap: 1rem; }
.js-bg { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(240,204,126,.045) 0 1px, transparent 1px 2rem), repeating-linear-gradient(90deg, rgba(240,204,126,.045) 0 1px, transparent 1px 2rem); }
.js-isi { position: relative; z-index: 2; } .js-seni { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; min-height: 0; } .js-seni .hero-svg { max-height: 100%; width: 100%; }
.js-eyebrow { display: inline-flex; align-items: center; gap: .7rem; font-size: .92rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--emas-m); } .js-eyebrow i { width: 2.4rem; height: .14rem; background: linear-gradient(90deg, var(--emas-t), transparent); display: inline-block; }
.js-judul { font-size: 4.6rem; line-height: 1.04; margin: 1rem 0 1rem; font-weight: 560; letter-spacing: -.03em; color: var(--gading); } .js-judul .kata { display: inline-block; } .js-judul .kata.kecil { font-size: .55em; font-weight: 300; font-style: italic; color: #B9C6DE; margin-right: .1em; } .js-judul .em { color: var(--emas-t); font-style: italic; font-weight: 500; }

      + '<h3>Prosedur empat langkah (berlaku untuk semua pos)</h3><ol class="langkah"><li><b>Sketsa.</b> Gambar kurva, pilih irisan: tegak bila ' + VR('y') + ' = …, datar bila ' + VR('x') + ' = ….</li><li><b>Batas.</b> Cari titik potong dengan sumbu atau antarkurva (samakan kedua persamaan, selesaikan).</li><li><b>Susun integral.</b> Atas − bawah (dx) atau kanan − kiri (dy). Uji satu titik di antara batas untuk menentukan siapa di atas/kanan. Pecah bila kurva memotong sumbu atau posisinya bertukar.</li><li><b>Hitung.</b> Antiturunan, lalu F(batas atas) − F(batas bawah). Luas harus positif.</li></ol>'
      + '<div class="kotak jingga"><div class="kecil-judul">Kapan memilih dy?</div><p class="kecil">Pilih irisan yang batas atas–bawah (atau kanan–kiri)-nya <b>tidak berganti</b> sepanjang daerah. Bila irisan tegak memaksa integral dipecah, coba irisan datar (dan sebaliknya).</p></div>'));

    /* 3-4. tujuh pos */
    [[0, 1, 2, 3], [4, 5, 6]].forEach((ix, h) => {
      pg.push(hal('Tujuh pos materi · ' + (h + 1) + ' dari 2', 3, ix.map((i) => { const f = UI.URUT[i], kk = K[f], v = kk.varian[0]; return '<div class="jenis' + (ix.length > 3 ? ' rapat' : '') + '" style="' + warnaVar(f) + '"><div class="j-grafik">' + gFam(f, 0, { titik: false }) + '</div><div class="j-teks"><div class="j-nama">Pos ' + (i + 1) + ' · ' + NAMA[f] + '</div><div class="j-alias">Juga disebut: ' + kk.alias.map(esc).join(' · ') + '</div><div class="j-rumus"><span>Contoh</span>' + v.rumus + '</div><div class="j-umum">' + kk.umum + '</div><div class="kecil-judul">Ciri</div><ul>' + kk.ciri.map((c) => '<li>' + esc(c) + '</li>').join('') + '</ul></div></div>'; }).join('')));
    });

    /* 5. tes awal */
    const so = B.soalSiswa(idx), jw = (P.tes && P.tes.jawab) || [], benar = so.filter((q, i) => jw[i] === q.kunci).length;
    pg.push(hal('Hasil tes awal dan pembahasan', 4,
      '<div class="skor"><div class="skor-b">' + benar + '<small>/5</small></div><div><b>Tes awal</b><div class="kecil">Jawaban yang benar: ' + benar + ' dari 5 soal. Pembahasan membantu mengingat langkahnya.</div></div></div>'
      + so.map((q, i) => { const ok = jw[i] === q.kunci, pil = jw[i]; return '<div class="soal ' + (ok ? 'ok' : 'salah') + '"><div class="s-kep"><span class="s-no">' + (i + 1) + '</span><div class="s-tanya">' + q.tanya + '</div>' + GF.soalHTML(q) + '<span class="s-st">' + (ok ? '✓ benar' : '✗ perlu dibahas') + '</span></div><div class="s-opsi">' + q.opsi.map((o, k) => '<span class="' + (k === q.kunci ? 'k' : '') + (k === pil && !ok ? ' p' : '') + '">' + 'ABCDE'[k] + '. ' + (q.html ? o : esc(o)) + '</span>').join('') + '</div><div class="s-jelas"><b>Pembahasan:</b> ' + q.jelas + '</div></div>'; }).join('')));

    /* 6. kartu pakar */
    const fam = (t.fam && t.fam.length) ? t.fam : [UI.URUT[0]];
    pg.push(hal('Kartu pakar: pos kelompokmu', 5,
      (t.grup ? '<p class="lead">Kelompok ' + t.grup + (t.mitra && t.mitra.length ? ' (kamu, ' + esc(t.mitra.join(' dan ')) + ')' : '') + ' menjadi pakar untuk <b>Pos ' + t.grup + ' · ' + NAMA[fam[0]] + '</b>. Peranmu: <b>' + esc(B.peranDariPos(t.pos || 0).panjang) + '</b>.</p>' : '<p class="lead">Kartu pakar membantu kita mengenal tiap pos lebih dalam.</p>')
      + fam.map((f, i) => { const q = B.tantanganAcak(f, 4100 + idx * 31 + i), st = t.kartu && t.kartu[f], kk = K[f]; return '<div class="pakar" style="' + warnaVar(f) + '"><div class="p-kep"><b>' + NAMA[f] + '</b><span>' + (st === 1 ? 'dikuasai' : (st ? 'sudah dibahas' : 'untuk dipelajari')) + '</span></div><div class="p-isi" style="grid-template-columns:62mm 1fr"><div class="j-grafik" style="height:50mm">' + gFam(f, 0, { titik: false }) + '</div><div><div class="kecil-judul">Rumus luas</div><p class="j-umum">' + kk.umum + '</p><div class="kecil-judul">Ciri</div><ul class="kecil" style="margin:0;padding-left:4mm">' + kk.ciri.map((c) => '<li>' + esc(c) + '</li>').join('') + '</ul></div></div><div class="p-isi" style="border-top:.3mm solid var(--w)"><div class="p-s"><div class="kecil-judul">Contoh soal cerita</div><p>' + q.tanya + '</p></div><div class="p-j"><div class="kecil-judul">Jawaban dan langkahnya</div><p><b>' + F(q.kunci) + '</b> satuan luas</p><p class="kecil">' + q.jelas + '</p></div></div></div>'; }).join('')
      + '<div class="kotak kuning"><div class="kecil-judul">Rumus luas ketujuh pos</div><table class="ct kecil-t"><tbody>' + UI.URUT.map((f, i) => '<tr><td><b style="color:' + TUA[f] + '">Pos ' + (i + 1) + ' · ' + NAMA[f] + '</b></td><td>' + K[f].umum + '</td></tr>').join('') + '</tbody></table></div>'));

    /* 7. pameran pakar */
    const pam = t.pam || {}, pj = pam.jawab || {}, s0 = (pam.peran === 'jaga' || (!pam.peran && !(t.pos > 0))) ? null : (t.pos === 2 ? 'B' : 'A'), r3 = s0 ? B.rute3(t.grup || 1, s0) : [], ketPam = { benar: '✓ soal benar', paham: '✓ dicentang paham', lewati: 'dilewati', gagal: 'belum benar', sendiri: 'pos kelompokku' };
    pg.push(hal('Pameran pakar: rute dan transfer ilmu', 6,
      '<p class="lead">Peranmu: <b>' + (s0 ? 'Penjelajah ' + s0 : 'Host (penjaga meja)') + '</b>' + (t.grup ? ' di Kelompok ' + t.grup : '') + '. Tujuannya: pada akhir pameran, semua anggota menguasai ketujuh pos.</p>'
      + (s0 ? '<div class="kotak ungu"><div class="kecil-judul">Rute keliling (10 menit per putaran)</div>' + tabel(['Putaran', 'Pos yang dikunjungi', 'Kelompok tuan rumah'], r3.map((g, i) => ['Putaran ' + (i + 1), '<b style="color:' + TUA[UI.URUT[g - 1]] + '">Pos ' + g + ' · ' + NAMA[UI.URUT[g - 1]] + '</b>', 'Kelompok ' + g])) + '</div>'
        + '<div class="kotak kuning"><div class="kecil-judul">Transfer ilmu</div><p class="kecil">Kamu mengajarkan <b>' + B.posAjar(t.grup || 1, s0).map((g) => 'Pos ' + g).join(', ') + '</b> kepada Host dan Penjelajah ' + (s0 === 'A' ? 'B' : 'A') + '. Kamu belajar <b>' + B.posTerima(t.grup || 1, s0).map((g) => 'Pos ' + g).join(', ') + '</b> dari Penjelajah ' + (s0 === 'A' ? 'B' : 'A') + '.</p></div>'
        : '<div class="kotak ungu"><div class="kecil-judul">Tugas Host</div><p class="kecil">Menetap di meja Pos ' + (t.grup || '') + ', menjelaskan pos kelompokmu kepada tamu pada Putaran 1, 2, dan 3 (tamu: Penjelajah A dan B dari dua kelompok berbeda tiap putaran), lalu belajar dari Penjelajah A (Transfer 1) dan Penjelajah B (Transfer 2).</p></div>')
      + '<h3>Status ketujuh pos</h3><div class="grid2">' + UI.URUT.map((f, i) => { const g = i + 1, st = (g === t.grup ? 'sendiri' : pj[g]); return '<div class="kasus" style="' + warnaVar(f) + '"><div class="k-kep"><span>' + g + '</span><b>' + NAMA[f] + '</b><em>' + (ketPam[st] || 'belum dikerjakan') + '</em></div><div class="j-grafik" style="height:24mm;margin-top:1mm">' + gFam(f, 0, { titik: false, tanpaTick: true }) + '</div></div>'; }).join('') + '</div>'));

    /* 8. tebak */
    const dis = B.diskusiSiswa(t.grup || (idx % 7) + 1);
    pg.push(hal('Tebak bagiannya (diskusi kelompok)', 7,
      '<p class="lead">Dari <b>cerita dan tabel</b> kita bisa menebak cara menghitung luasnya. Perhatikan: ada kolom negatif? sama di ujung-ujung? posisi atas–bawah bertukar? ditulis sebagai x atau y?</p>'
      + '<div class="grid2">' + dis.map((s, i) => { const r = t.dis && t.dis.rnd && t.dis.rnd[i]; return '<div class="kasus" style="' + warnaVar(s.fam) + '"><div class="k-kep"><span>' + (i + 1) + '</span><b>' + esc(s.judul) + '</b>' + (r ? '<em>' + (r.ok ? '✓ tepat' : 'dibahas') + '</em>' : '') + '</div><p class="kecil">' + esc(s.konteks) + '</p><div class="mini">' + '<span><b>' + s.kol.map(esc).join(' | ') + '</b></span>' + s.baris.slice(0, 5).map((b) => '<span>' + b.join(' | ') + '</span>').join('') + '</div><div class="k-jwb">Bagian <b>' + NAMA[s.fam] + '</b></div><p class="kecil">' + esc(s.alasan) + '</p></div>'; }).join('') + '</div>'));

    /* 9. cocokkan */
    const coc = B.cocokSiswa(idx), cj = (t.cocok && t.cocok.jawab) || [];
    pg.push(hal('Cocokkan masalah dengan cara hitung', 8,
      '<p class="lead">Lima masalah nyata. Dari cerita dan tabelnya kita memilih bagian (cara hitung) yang cocok, lalu membayangkan daerahnya.</p>'
      + coc.map((it, i) => { const s = B.SITUASI[it.situasi], ok = cj[i] === it.kunci; return '<div class="cocok" style="' + warnaVar(it.fam) + '"><div class="c-g">' + gbr(s.spec, { titik: false, tanpaTick: true, W: 460, H: 300 }) + '</div><div class="c-t"><div class="c-kep"><b>' + (i + 1) + '. ' + esc(s.judul) + '</b><span class="' + (ok ? 'ok' : 'no') + '">' + (cj[i] == null ? 'belum dijawab' : (ok ? '✓ tepat' : '✗ dibahas')) + '</span></div><p class="kecil">' + esc(s.teks) + '</p><p class="c-f">Bagian <b>' + NAMA[it.fam] + '</b></p><p class="kecil"><b>Mengapa?</b> ' + esc(s.alasan) + '</p></div></div>'; }).join('')));

    /* 10. tantangan sintesis */
    const ts = B.tugasSintesis(t.fung && t.fung.seed != null ? t.fung.seed : idx), hf = (t.fung && t.fung.hasil) || [];
    pg.push(hal('Tantangan sintesis: dari gambar ke integral', 9,
      '<p class="lead">Dari gambar daerah dan persamaan kurvanya: <b>tentukan batas</b>, <b>tentukan atas–bawah (atau kanan–kiri)</b>, susun integralnya, lalu hitung.</p>'
      + ts.map((tg, i) => { const h = hf[i]; return '<div class="soal ' + (h && h.ok ? 'ok' : 'salah') + '"><div class="s-kep"><span class="s-no">' + (i + 1) + '</span><div class="s-tanya">' + esc(tg.judul) + '</div><span class="s-st">' + (h ? (h.ok ? '✓ tepat' : 'dibahas') : 'belum dikerjakan') + '</span></div><div class="dua b21" style="margin:1.5mm 0 0 8.5mm"><div class="grafik" style="height:40mm;padding:1mm">' + gbr(tg.spec, { titik: false, tanpaTick: true, W: 420, H: 270 }) + '</div><div><div class="kecil" style="font-weight:700">' + tg.persamaan.join('<br>') + '</div><div class="s-jelas" style="margin:1mm 0 0"><b>Cara menemukan:</b> ' + tg.jelas + '</div></div></div></div>'; }).join('')));

    /* 11. tiket + refleksi */
    const tk = B.tiketSiswa(idx), tkj = (t.tiket && t.tiket.jawab) || [], kuasai = (t.ref && t.ref.kuasai) || [], bingung = (t.ref && t.ref.bingung) || [];
    pg.push(hal('Tiket keluar dan refleksi', 10,
      tk.map((q, i) => { const ok = (t.tiket && t.tiket.ok) ? t.tiket.ok[i] : tkj[i] === q.kunci; return '<div class="soal ' + (ok ? 'ok' : 'salah') + '"><div class="s-kep"><span class="s-no">' + (i + 1) + '</span><div class="s-tanya">' + (q.jenis === 'cocok' ? 'Masalah “' + esc(B.SITUASI[q.situasi].judul) + '”: bagian apa yang cocok?' : (q.jenis === 'nama' ? 'Daerah terarsir: bagian apa yang cocok?' : q.tanya)) + '</div><span class="s-st">' + (ok ? '✓ benar' : '✗ perlu dibahas') + '</span></div><div class="s-jelas"><b>Jawaban:</b> ' + (q.jenis === 'hitung' ? '<b>' + F(q.kunci) + '</b>. ' + q.jelas : (q.jenis === 'cocok' ? NAMA[q.fam] + '. ' + esc(B.SITUASI[q.situasi].alasan) : (q.jenis === 'nama' ? NAMA[q.fam] + '.' : q.jelas))) + '</div></div>'; }).join('')
      + '<div class="dua"><div class="kotak mint"><div class="kecil-judul">Yang sudah kukuasai</div><div class="chips">' + (kuasai.length ? kuasai.map((f) => '<span style="background:' + MUDA[f] + ';color:' + TUA[f] + '">' + NAMA[f] + '</span>').join('') : '<span class="muted">belum dipilih</span>') + '</div></div><div class="kotak jingga"><div class="kecil-judul">Yang masih perlu kuulang</div><div class="chips">' + (bingung.length ? bingung.map((f) => '<span style="background:' + MUDA[f] + ';color:' + TUA[f] + '">' + NAMA[f] + '</span>').join('') : '<span class="muted">tidak ada</span>') + '</div></div></div>'
      + '<div class="c-hadiah"><div><div class="kecil-judul">Penghargaanmu</div><b class="c-gelar">' + esc(poin.gelar) + '</b></div><div class="poin"><span>' + poin.poin + '</span><small>skor capaian</small></div><div class="lenc">' + (poin.lencana.length ? poin.lencana.map((l) => '<span>★ ' + esc(l) + '</span>').join('') : '<span>Terus berlatih untuk lencana berikutnya</span>') + '</div></div>'));

    /* 12. rangkuman */
    pg.push(hal('Lembar rangkuman', 11,
      '<div class="dua"><div class="kotak ungu"><div class="kecil-judul">Rumus inti</div><ul><li>Di bawah sumbu: <b>L = −∫ f dx</b>.</li><li>Memotong sumbu di c: <b>L = |∫<sub>a</sub><sup>c</sup> f dx| + |∫<sub>c</sub><sup>b</sup> f dx|</b>.</li><li>Antara dua kurva (tegak): <b>L = ∫ (y<sub>atas</sub> − y<sub>bawah</sub>) dx</b>.</li><li>Antara dua kurva (datar): <b>L = ∫ (x<sub>kanan</sub> − x<sub>kiri</sub>) dy</b>.</li><li>Posisi bertukar: pecah di titik potong tengah.</li></ul></div><div class="kotak kuning"><div class="kecil-judul">Kesalahan yang sering terjadi</div><ul><li><b>Lupa tanda</b>: luas negatif. Periksa apakah kurva di bawah sumbu.</li><li><b>Lupa memecah</b> saat kurva memotong sumbu atau posisi atas–bawah bertukar.</li><li><b>Batas salah</b>: titik potong belum dicari, atau variabelnya tertukar (x untuk dy).</li><li><b>Atas dan bawah terbalik</b>: uji satu titik di antara batas.</li><li><b>Salah menghitung F(b) − F(a)</b>: tulis tiap nilai dengan kurung.</li></ul></div></div>'
      + '<div class="galeri-m" style="grid-template-columns:repeat(4,1fr)">' + UI.URUT.map((f, i) => '<div style="--t:' + MUDA[f] + ';--d:' + TUA[f] + '"><div class="gm-g">' + gFam(f, 0, { titik: false, tanpaTick: true, W: 360, H: 240 }) + '</div><b>Pos ' + (i + 1) + ' · ' + NAMA[f] + '</b><span>' + esc(K[f].ciri[0]) + '</span></div>').join('') + '</div>'
      + '<div class="kotak mint"><div class="kecil-judul">Tugas kecil</div><p>Temukan satu daerah di sekitarmu (kolam, lahan, atap, jalan). Gambar sketsanya, tentukan apakah kamu akan memakai irisan tegak (dx) atau datar (dy), dan tuliskan alasannya. Ceritakan di pertemuan berikutnya.</p></div>'));

    /* sampul */
    const sk = '<section class="hal sampul"><svg class="s-hias" viewBox="0 0 800 500" preserveAspectRatio="none"><g stroke-linecap="round"><g fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".28" stroke-width="2"><rect x="40" y="260" width="62" height="240"/><rect x="102" y="220" width="62" height="280"/><rect x="164" y="190" width="62" height="310"/><rect x="226" y="175" width="62" height="325"/><rect x="288" y="180" width="62" height="320"/><rect x="350" y="205" width="62" height="295"/><rect x="412" y="250" width="62" height="250"/><rect x="474" y="310" width="62" height="190"/></g><g fill="none" stroke-width="6"><path d="M20 330C180 120 330 120 500 290S740 470 820 470" stroke="#E0AE4A" opacity=".65"/><path d="M-20 440C200 430 420 380 560 250S760 40 820 20" stroke="#7FE0D3" opacity=".5"/></g></g></svg><div class="s-isi"><div class="s-eye">Matematika Tingkat Lanjut · ' + esc(B.cfg(B.kelasAktif()).nama) + '</div><h1>Catatan<br>Belajar</h1><div class="s-sub">Area <b>&amp; Calculus</b></div><div class="s-nama"><small>Catatan milik</small>' + esc(nama) + '</div></div><div class="s-bawah"><div><b>' + benar + '/5</b><span>tes awal</span></div><div><b>' + poin.poin + '</b><span>skor capaian</span></div><div><b>' + esc(poin.gelar) + '</b><span>capaian</span></div></div><div class="s-kaki">SMA Vidatra Bontang · ' + tgl + '</div></section>';
    return sk + pg.join('');
  }

    async function segar() { if (!w.isConnected) return tutupPoll(); const r = await api('kelompok', { idx }); if (r.ok && r.kelompok) { const tt = JSON.stringify(r.kelompok.map((g) => g.map((s) => s.idx))); if (tt !== tanda) tampil(r.kelompok, r.saya); } }
    function tampil(kel, saya) {
      const pertama = lama === null, ada = new Set(kel.flat().map((s) => s.idx)), maks = B.cfg(kelas).maks, total = B.cfg(kelas).daftar.length; tanda = JSON.stringify(kel.map((g) => g.map((s) => s.idx)));
      w.innerHTML = ''; const kepala = el('div', { kelas: 'baris', gaya: 'justify-content:space-between;margin-bottom:.6rem' }, el('div', null, el('div', { kelas: 'eyebrow' }, 'Kelompok belajar · langsung'), el('h2', { gaya: 'margin:0' }, 'Kamu di Kelompok ' + (saya + 1))), el('div', { kelas: 'baris' }, el('span', { kelas: 'chip sorot', html: '<i class="titik-hidup"></i>' + ada.size + ' dari ' + total + ' murid sudah masuk' }), el('button', { kelas: 'btn', type: 'button', html: 'Saya sudah di meja kelompok' + ik('panah'), onclick: lanjutKe })));
      const grid = el('div', { kelas: 'grid-kel' + (kel.length > 4 ? ' g7' : '') }); w.append(kepala, el('div', { kelas: 'umpan ok', html: ik('info') + '<span>' + (B.cfg(kelas).manual ? 'Pindahlah ke meja kelompokmu. Kelompok disusun oleh gurumu.' : 'Pindahlah ke meja kelompokmu. Teman yang baru selesai tes akan muncul sendiri di sini. Peran (Host, Penjelajah A, Penjelajah B) mengikuti urutan di kartu.') + '</span>' }), grid);
      kel.forEach((g, gi) => { const k = el('div', { kelas: 'kel-kartu' + (gi === saya ? ' saya' : ''), 'data-g': gi }); const fam = B.bagianKelompok(gi); k.classList.add('fx-' + fam); k.append(el('div', { kelas: 'kel-judul' }, 'Kelompok ' + (gi + 1), el('span', { kelas: 'chip abu' }, g.length + ' / ' + maks)), el('div', { kelas: 'kel-pos', html: UI.ubin(fam) + '<span>Pos ' + (gi + 1) + ' · ' + esc(UI.NAMA[fam]) + '</span>' }));
        g.forEach((s, pi) => { const baru = !pertama && !lama.has(s.idx), n = el('div', { kelas: 'kel-nama' + (s.idx === idx ? ' aku' : '') + (baru ? ' baru' : '') }, el('span', { kelas: 'av2 fx-' + warnaNama[s.idx % 7] }, inisial(s.nama)), el('span', null, s.nama + (s.idx === idx ? ' (kamu)' : '')), el('span', { kelas: 'peran-kecil' }, B.peranDariPos(pi).nama)); k.append(n); if (baru) anim(n, [{ opacity: 0, transform: 'translateX(-1rem) scale(.96)', background: '#FBF1D8' }, { opacity: 1, transform: 'none', background: '#FBF1D8', offset: .5 }, { opacity: 1, transform: 'none' }], { duration: 1100 }); });
        for (let pi = g.length; pi < maks; pi++) k.append(el('div', { kelas: 'kel-nama kosong' }, el('span', { kelas: 'av2 kosong' }, '?'), el('span', null, 'Menunggu teman…'), el('span', { kelas: 'peran-kecil' }, B.peranDariPos(pi).nama)));
        grid.append(k); if (pertama) anim(k, [{ opacity: 0, transform: 'translateY(1rem)' }, { opacity: 1, transform: 'none' }], { duration: 500, delay: gi * 120 }); });
      if (pertama) setTimeout(() => konfeti(innerWidth / 2, innerHeight * .25, 40), 600); lama = ada;
      if (!kelTimer) kelTimer = setInterval(segar, 4000);
    }
    muat();
  }

  /* ---------------------------------------------------------------- 8. tahap berikutnya */
  function sLanjut() {
    gambarAtas(); Tahap2.mulai({ idx: () => idx, P: () => P, simpan, api, layar, net: () => net, cekNet: cekJaringan, gambarAtas, bawahKosong: kosongkanBawah, konfeti }); return;
    kosongkanBawah(); const w = el('div', { kelas: 'tengah-isi' }); w.innerHTML = '<span class="ubin fx-parab" style="width:5.5rem;height:5.5rem">' + UI.glif('parab') + '</span><h2>Tahap berikutnya</h2><p class="muted" style="max-width:38rem;font-size:1.2rem">Tunggu arahan gurumu. Kegiatan berikutnya dilakukan bersama kelompok.</p>';
    w.append(el('button', { kelas: 'btn sekunder', type: 'button', html: ik('kelompok') + 'Lihat kelompok lagi', onclick: () => { P.tahap = 'kelompok'; simpan(); sKelompok(); } })); layar(w, 'tengah-layar');
  }

  /* ---------------------------------------------------------------- mulai */
  UI.pasangPutar(); gambarAtas(); sWelcome(); cekJaringan();
  window.acDebug = { intro: () => intro, P: () => P, idx: () => idx, net: () => net, ke: { welcome: sWelcome, kelas: sKelas, nama: sNama, intro: sIntro, tes: sTes, hasil: sHasil, kelompok: sKelompok, lanjut: sLanjut }, pilih: (i) => { idx = i; P = lsGet(kunciP(i), null) || baruP(); return P; }, set: (i, p) => { idx = i; P = p; simpan(); } };
})();
</script>
